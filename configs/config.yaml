
# Federation settings
num_clients: 5        # how many simulated clients
rounds: 10            # number of federated rounds
skew_type: uniform           # or 'uniform', or 'label', feature, volume, combined
feature_column: category  # which feature to skew, if applicable



# Local training
batch_size: 64        # larger batch to stabilize norms
local_epochs: 5       # more epochs per client
lr: 0.0005            # lower LR for BCEWithLogitsLoss
weight_decay: 1e-5    # L2 regularization
threshold: 0.45       # sigmoid threshold for binary classification
label_smoothing: 0.1  # label smoothing factor

focal_alpha: 0.25
focal_gamma: 2.0

# Model architecture
hidden_dims:
  - 64
  - 32
dropout: 0.1          # light dropout for tabular data

# Scheduler (optional)
scheduler:
  step_size: 5
  gamma: 0.5

# Data paths
raw_data_path: data/raw/payment_fraud.csv
processed_data_dir: data/processed